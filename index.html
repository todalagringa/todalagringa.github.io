/* Layout: una sola columna tipo app de bolsillo; cabecera azul de la marca con el toro, categoría y torneo, pestañas debajo, contenido en "planillas". */
:root{
  /* Paleta de marca: azul #00335e, naranja #e66d00, amarillo #ffb100, grafito #303030, gris #e7e7e7 */
  --bg:#f3f3f3; --surface:#ffffff; --sunk:#e7e7e7; --line:#dcdcdc;
  --ink:#303030; --muted:#6b6f75;
  --brand:#00335e; --brand-ink:#ffffff;
  --accent:#e66d00; --accent-text:#c25a00; --accent-soft:#fde9d6;
  --red:#cf3a2b; --yellow:#ffb100; --gold:#b37a00;
  --win:#1f8a52; --draw:#9a9da2; --loss:#cf3a2b;
  --f-display:"Tektur","Arial Narrow",system-ui,sans-serif;
  --f-body:"Tektur",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#071623; --surface:#0d2236; --sunk:#0a1b2b; --line:#1b3550;
  --ink:#eef1f4; --muted:#93a3b4;
  --brand:#00335e; --brand-ink:#ffffff;
  --accent:#ff8a24; --accent-text:#ff9a3d; --accent-soft:#3a2410;
  --red:#ef6b5b; --yellow:#ffb100; --gold:#ffc23d;
  --win:#3fb57a; --draw:#6d7c8c; --loss:#ef6b5b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071623; --surface:#0d2236; --sunk:#0a1b2b; --line:#1b3550;
  --ink:#eef1f4; --muted:#93a3b4;
  --brand:#00335e; --brand-ink:#ffffff;
  --accent:#ff8a24; --accent-text:#ff9a3d; --accent-soft:#3a2410;
  --red:#ef6b5b; --yellow:#ffb100; --gold:#ffc23d;
  --win:#3fb57a; --draw:#6d7c8c; --loss:#ef6b5b; color-scheme:dark}

/* Color de página según el torneo: Apertura/Clausura gris, Copas naranja, Nocturno Verano azul, Mundialito negro.
   --t-* solo pintan lo que va directo sobre el fondo de página; las planillas conservan sus colores. */
:root{--t-bg:#e7e7e7;--t-ink:#00335e;--t-sub:#4a4f55;--t-sel:#e66d00;--t-sel-ink:#ffffff;--t-tab:#e66d00;--t-line:#e66d00;--t-link:#c25a00}
:root[data-torneo="copa"]{--t-bg:#e66d00;--t-ink:#ffffff;--t-sub:#fff1e3;--t-sel:#303030;--t-sel-ink:#ffffff;--t-tab:#ffffff;--t-line:#303030;--t-link:#ffffff;--brand:#303030}
:root[data-torneo="nocturno"]{--t-bg:#00335e;--t-ink:#ffffff;--t-sub:#c9d6e3;--t-sel:#e66d00;--t-sel-ink:#ffffff;--t-tab:#ffb100;--t-line:#e66d00;--t-link:#ffb100;
  /* planillas en un azul un tono más claro que la página */
  --bg:#00335e;--surface:#0b4477;--sunk:#083b69;--line:#1f5585;--ink:#ffffff;--muted:#b4c5d7;
  --accent-text:#ffb100;--accent-soft:#3a3410;--gold:#ffc23d;--win:#3fc184;--draw:#8ea2b6;--loss:#ff7a6b;--red:#ff7a6b;color-scheme:dark}
:root[data-torneo="mundialito"]{--t-bg:#000000;--t-ink:#ffffff;--t-sub:#b9b9b9;--t-sel:#e66d00;--t-sel-ink:#ffffff;--t-tab:#ffb100;--t-line:#e66d00;--t-link:#ffb100;
  /* planillas un tono más claro que el negro */
  --bg:#000000;--surface:#1b1b1b;--sunk:#131313;--line:#2f2f2f;--ink:#ffffff;--muted:#a9a9a9;
  --accent-text:#ff9a3d;--gold:#ffc23d;--win:#3fc184;--draw:#7d7d7d;--loss:#ff7a6b;--red:#ff7a6b;color-scheme:dark}
/* Apertura/Clausura: planillas un tono más oscuro que el gris */
:root[data-torneo="liga"]{--bg:#e7e7e7;--surface:#d8d8d8;--sunk:#cacaca;--line:#bfbfbf;--ink:#303030;--muted:#55585c;
  --accent-text:#a34900;--gold:#8a5d00;--win:#1b7a48;--draw:#8a8d91;--loss:#b8321f;--red:#b8321f;color-scheme:light}
/* Copas: planillas un naranja más oscuro */
:root[data-torneo="copa"]{--bg:#e66d00;--surface:#b55400;--sunk:#a04a00;--line:#cc6612;--ink:#ffffff;--muted:#ffe0c2;
  --accent-text:#ffffff;--gold:#fff1c2;--win:#bff5d6;--draw:#f2c79d;--loss:#ffd6cf;--red:#ffd6cf;--yellow:#ffd23f;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--t-bg);color:var(--ink);transition:background-color .25s;font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--t-bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--t-bg);color:var(--t-ink);border-bottom:3px solid var(--t-line);transition:background-color .25s}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:12px;padding-block:14px 10px}
.brand img{width:52px;height:auto;flex:none}
.brand h1{flex:1;min-width:0}
.ig{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid color-mix(in srgb,currentColor 40%,transparent);color:inherit;text-decoration:none;font:700 12px var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.ig:hover{background:color-mix(in srgb,currentColor 12%,transparent)}
@media (max-width:480px){.ig span{display:none}.ig{padding:8px}}
footer{display:flex;flex-direction:column;align-items:center;gap:8px}
.igfoot{display:inline-flex;align-items:center;gap:8px;color:var(--t-ink);text-decoration:none;font-size:13.5px}
.igfoot:hover span{text-decoration:underline}
.brand h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(19px,5.4vw,26px);line-height:1;letter-spacing:0;text-transform:uppercase}
.brand h1 small{display:block;font-size:.5em;font-weight:500;letter-spacing:.06em;opacity:.8;margin-top:4px}
.picker{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:10px;align-items:center}
.seg{display:inline-flex;background:color-mix(in srgb,currentColor 12%,transparent);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;color:inherit}
.seg button[aria-pressed="true"]{background:var(--t-sel);color:var(--t-sel-ink)}
select#season{appearance:none;border:1px solid color-mix(in srgb,currentColor 40%,transparent);background:transparent;color:inherit;border-radius:999px;padding:7px 30px 7px 14px;font:600 13px var(--f-body);cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
select#season option{color:#13261c;background:#fff}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-3px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:transparent;color:inherit;opacity:.75;padding:10px 12px 11px;font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.02em;text-transform:uppercase;cursor:pointer;border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--t-tab);color:var(--t-tab)}

main{padding-block:18px 48px;display:flex;flex-direction:column;gap:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
h2{color:var(--t-ink);margin:0;font-family:var(--f-display);font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:0;line-height:1.1}
h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.02em}
.hint{color:var(--t-sub);font-size:13px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.empty{padding:22px;color:var(--muted);text-align:center}

/* Tabla de posiciones */
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:700 11px var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:center;padding:9px 6px;background:var(--sunk);white-space:nowrap}
td{padding:8px 6px;text-align:center;border-top:1px solid var(--line);white-space:nowrap}
th.l,td.l{text-align:left}
td.pos{width:28px;color:var(--muted);font-weight:700}
td.pts{font-family:var(--f-display);font-weight:800;font-size:16px}
tr.lead td.pos{color:var(--accent-text)}
.teamcell{display:flex;align-items:center;gap:9px;min-width:0}
.teambtn{border:0;background:none;padding:0;cursor:pointer;display:flex;align-items:center;gap:9px;text-align:left;font-weight:600}
.teambtn:hover span:last-child{text-decoration:underline}
.crest{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 9.5px var(--f-display);letter-spacing:.02em;color:#fff;overflow:hidden}
.crest.img{background:none;border-radius:0}
.crest img{width:100%;height:100%;object-fit:contain}
.form{display:inline-flex;gap:3px}
.form i{width:8px;height:8px;border-radius:2px;display:block}
.form .W{background:var(--win)} .form .D{background:var(--draw)} .form .L{background:var(--loss)}
.hide-sm{}
@media (max-width:520px){.hide-sm{display:none}}

/* Fixture */
.rounds{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.rounds button{flex:none;min-width:40px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font:700 14px var(--f-display);cursor:pointer}
.rounds button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rounds button.done::after{content:"";display:block;height:2px;background:var(--accent-text);margin-top:2px;border-radius:2px}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 12px;align-items:start;padding:14px 14px 12px;border-top:1px solid var(--line)}
.match:first-child{border-top:0}
.side{display:flex;flex-direction:column;gap:6px;min-width:0}
.side.away{align-items:flex-end;text-align:right}
.side .who{display:flex;align-items:center;gap:8px;font-weight:700;min-width:0}
.side.away .who{flex-direction:row-reverse}
.side .who span{overflow-wrap:anywhere}
.score{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1;padding-top:1px;text-align:center;min-width:72px}
.score small{display:block;font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.score.sched{font-size:20px;color:var(--ink);padding-top:2px;letter-spacing:0}
.score .when{text-transform:none;letter-spacing:.02em}
.score.pending{font-size:12px;color:var(--muted);padding-top:6px;letter-spacing:.08em}
.ev{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.card{display:inline-block;width:8px;height:11px;border-radius:1.5px;vertical-align:-1px;margin-right:4px}
.card.A{background:var(--yellow)} .card.R{background:var(--red)}
.ball{font-style:normal;font-size:12px;line-height:1;margin-right:4px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.tag{display:inline-block;font:700 10.5px var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.mfoot{grid-column:1/-1;display:flex;justify-content:center;gap:8px}

/* Rankings */
.rank{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.rank:first-child{border-top:0}
.rank .n{font:800 16px var(--f-display);color:var(--muted);text-align:center}
.rank.top3 .n{color:var(--accent-text)}
.rank .who{min-width:0}
.rank .who b{display:block;font-weight:700;overflow-wrap:anywhere}
.rank .who span{font-size:13px;color:var(--muted)}
.rank .val{font:800 21px var(--f-display);text-align:right}
.rank .val small{display:block;font:600 11px var(--f-body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:var(--sunk);padding:11px;font-weight:700;cursor:pointer;color:var(--accent-text)}

/* Sanciones */
.sanc{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.sanc:first-child{border-top:0}
.sanc .d{font-size:13px;color:var(--muted)}
.pill{font:700 12px var(--f-body);padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.red{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.pill.yel{background:color-mix(in srgb,var(--yellow) 22%,transparent);color:var(--gold)}
.pill.ok{background:var(--sunk);color:var(--muted)}

/* Play-off */
.champ{display:flex;align-items:center;gap:14px;padding:16px;background:var(--brand);color:var(--brand-ink);border-radius:var(--r);border-left:6px solid var(--yellow);position:relative;overflow:hidden}
.champ::after{content:"";position:absolute;right:-18px;bottom:-22px;width:120px;height:117px;background:url(marca/toro-blanco.webp) center/contain no-repeat;opacity:.12;pointer-events:none}
.champ .crest{width:48px;height:48px;font-size:17px}
.champ .cup{font:800 11px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--yellow)}
.champ .name{font:900 21px var(--f-display);text-transform:uppercase;line-height:1}
.series{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.series:first-child{border-top:0}
.srow{display:grid;grid-template-columns:1fr repeat(var(--legs),34px) 40px;align-items:center;gap:6px}
.srow .t{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.srow .t span{overflow-wrap:anywhere}
.srow .g{text-align:center;font:700 15px var(--f-display);color:var(--muted)}
.srow .agg{text-align:center;font:800 17px var(--f-display)}
.srow.w .t{font-weight:800}
.srow.w .agg{color:var(--accent-text)}
.slabel{display:grid;grid-template-columns:1fr repeat(var(--legs),34px) 40px;gap:6px;font:700 10.5px var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.slabel span{text-align:center}
.note{font-size:12.5px;color:var(--t-sub)}
.sheet .note,.champ .note{color:var(--muted)}
main h3{color:var(--t-ink)}
.sheet h3,dialog h3{color:inherit}

/* Historial */
.palm{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:13px 14px;border-top:1px solid var(--line);align-items:center}
.palm:first-child{border-top:0}
.palm .tn{font-weight:700}
.palm .cp{font-size:13px;color:var(--muted)}
.palm .w{display:flex;align-items:center;gap:8px;font-weight:800;justify-content:flex-end}
.linkbtn{border:0;background:none;color:var(--accent-text);font-weight:700;cursor:pointer;padding:0}

/* Ficha de equipo */
dialog{border:0;padding:0;border-radius:14px;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(5,15,10,.55)}
.dlg-h{display:flex;align-items:center;gap:12px;padding:16px;background:var(--brand);color:var(--brand-ink);position:sticky;top:0;border-bottom:3px solid var(--accent)}
.dlg-h h3{flex:1;font-size:18px}
.dlg-h .crest{width:40px;height:40px;font-size:15px}
.close{border:0;background:color-mix(in srgb,var(--brand-ink) 18%,transparent);color:inherit;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:20px;line-height:1}
.dlg-b{padding:14px 16px 18px;display:flex;flex-direction:column;gap:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stats div{background:var(--sunk);border-radius:8px;padding:8px;text-align:center}
.stats b{display:block;font:800 18px var(--f-display)}
.stats span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mini{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.mini .r{font:800 12px var(--f-body);color:var(--muted)}
.mini .s{font:800 15px var(--f-display)}
.res{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;color:#fff;font:800 11px var(--f-body);margin-left:6px}
.res.W{background:var(--win)} .res.D{background:var(--draw)} .res.L{background:var(--loss)}

.bwrap{overflow-x:auto}
.bracket{display:flex;gap:22px;padding:14px;min-width:min-content}
.bcol{flex:none;width:184px;display:flex;flex-direction:column;gap:8px}
.bh{font:700 11.5px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bh small{font-weight:500;letter-spacing:0;text-transform:none}
.bslots{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:12px}
.bbox{position:relative;height:64px;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:visible}
.bbox.empty{visibility:hidden}
.bcol:not(.last) .bbox:not(.empty)::after{content:"";position:absolute;left:100%;top:50%;width:22px;border-top:2px solid var(--line)}
.brow{height:31px;display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:7px;padding:0 9px;font-size:12.5px}
.brow+.brow{border-top:1px solid var(--line)}
.brow .crest{width:20px;height:20px;font-size:8px}
.brow .bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow b{font:800 14px var(--f-display);color:var(--muted)}
.brow.w{font-weight:700}.brow.w b{color:var(--accent-text)}
.brow.w{box-shadow:inset 3px 0 0 var(--yellow)}
.bpen{position:absolute;right:6px;bottom:-15px;font:600 10px var(--f-body);color:var(--muted);font-style:normal}
.prow{grid-template-columns:30px 20px 1fr auto}
.seed{font:700 10px var(--f-display);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph{color:var(--muted);font-style:italic}
.bbox.prov{border-style:dashed}
.bcol{width:204px}
.aggline{padding:9px 14px;border-top:1px dashed var(--line);background:var(--sunk);font-size:12.5px;color:var(--muted);text-align:center}
.det summary{cursor:pointer;font-weight:700;color:var(--t-link);padding:4px 0}
.soon{position:relative;overflow:hidden;padding:44px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.soon img{width:92px;height:auto;opacity:.9}
.soon .big{font:900 clamp(26px,8vw,40px) var(--f-display);text-transform:uppercase;letter-spacing:.02em;color:var(--ink);line-height:1}
.soon p{margin:0;max-width:40ch;color:var(--muted)}
.soon .chip{font:700 11px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-text);border:1px solid var(--accent);border-radius:999px;padding:4px 10px}
footer{color:var(--t-sub);font-size:12.5px;text-align:center;padding-bottom:28px}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}

<script>
(function(){
const TABS=[["posiciones","Posiciones"],["fixture","Fixture"],["goleadores","Goleadores"],["vallas","Valla"],["tarjetas","Tarjetas"],["playoff","Play-off"],["historial","Historial"]];
const TABS_KO=[["llave","Llave"],["fixture","Fixture"],["goleadores","Goleadores"],["vallas","Valla"],["tarjetas","Tarjetas"],["historial","Historial"]];
const ALL_TABS=[...TABS,["llave","Llave"]];
const isKO=t=>!!t&&norm(t.name).startsWith("COPA");
const tabsFor=t=>isKO(t)?TABS_KO:TABS;
const STAGES=["Octavos de final","Cuartos de final","Semifinal","Tercer puesto","Final"];
let DATA=null, S={cat:"Libre",tid:null,tab:"posiciones",round:null,showAll:{}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/\s+/g," ").trim();
const nice=s=>String(s).toLowerCase().replace(/(^|[\s.'-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

/* ---------- insignias ---------- */
function hue(name){let h=0;for(const c of norm(name))h=(h*31+c.charCodeAt(0))%360;return h}
function initials(name){const w=norm(name).replace(/\b(F\.?C\.?|DEP\.?|DEPORTIVO|LA|LOS|LAS|EL|DE|O)\b/g," ").split(/\s+/).filter(Boolean);
  const src=w.length?w:norm(name).split(" ");return (src.length>1?src[0][0]+src[1][0]:src[0].slice(0,2)).replace(/[^A-Z0-9]/g,"")}
function crest(name){const c=DATA.crests||{};const url=c[S.cat+"|"+name]||c[name];
  if(url)return `<span class="crest img"><img src="${esc(url)}" alt="" loading="lazy"></span>`;
  return `<span class="crest" aria-hidden="true" style="background:hsl(${hue(name)} 42% 34%)">${esc(initials(name))}</span>`}
const teamBtn=n=>`<button class="teambtn" data-team="${esc(n)}">${crest(n)}<span>${esc(n)}</span></button>`;

/* ---------- cálculos ---------- */
const T=()=>DATA.tournaments.find(t=>t.id===S.tid);
const played=m=>m.hg!=null&&m.ag!=null;
const regular=t=>t.matches.filter(m=>m.phase==="regular");
function lastRound(t){let r=0;for(const m of regular(t))if(played(m))r=Math.max(r,m.round);return r}
function standings(t){
  const row={};for(const g of t.groups)for(const n of g.teams)row[n]={team:n,group:g.name,pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,pts:0,form:[]};
  const ms=regular(t).filter(played).sort((a,b)=>a.round-b.round);
  for(const m of ms){for(const [me,op,gf,gc] of [[m.home,m.away,m.hg,m.ag],[m.away,m.home,m.ag,m.hg]]){
    const r=row[me];if(!r)continue;r.pj++;r.gf+=gf;r.gc+=gc;
    if(gf>gc){r.pg++;r.pts+=3;r.form.push("W")}else if(gf===gc){r.pe++;r.pts+=1;r.form.push("D")}else{r.pp++;r.form.push("L")}}}
  const sort=a=>a.sort((x,y)=>y.pts-x.pts||(y.gf-y.gc)-(x.gf-x.gc)||y.gf-x.gf||x.team.localeCompare(y.team));
  return t.groups.map(g=>({name:g.name,rows:sort(g.teams.map(n=>row[n]))}));
}
const inStats=m=>m.phase==="regular"||m.comp==="Zona Campeonato"||m.comp==="Copa";
function goalEvents(t){const out=[];for(const m of t.matches.filter(inStats))for(const [p,team,k,n] of m.ev)if(k==="G"&&norm(p)!=="AUTO GOL")out.push({p,team,n,m});return out}
function scorers(t){const map=new Map();for(const e of goalEvents(t)){const k=norm(e.p)+"|"+e.team;const x=map.get(k)||{p:e.p,team:e.team,g:0,pj:new Set()};x.g+=e.n;x.pj.add(e.m.id);map.set(k,x)}
  return [...map.values()].sort((a,b)=>b.g-a.g||a.p.localeCompare(b.p))}
function cardsOf(t){const out=[];for(const m of t.matches)for(const [p,team,k,n] of m.ev)if(k==="A"||k==="R")out.push({p,team,k,n,m});return out}
function roundLabel(m){return m.phase==="regular"?`Fecha ${m.round}`:`${m.stage}${m.leg?(m.leg===1?" · ida":" · vuelta"):""}`}

/* ---------- vistas ---------- */
function vPosiciones(t){
  const st=standings(t);const multi=st.length>1;
  return st.map(g=>`<section class="view">
    <div class="sec-h"><h2>${multi?esc(g.name):"Tabla de posiciones"}</h2><span class="hint">${lastRound(t)?`Tras la fecha ${lastRound(t)}`:"Sin partidos jugados"}</span></div>
    <div class="sheet tscroll" style="margin-top:10px"><table>
    <thead><tr><th>#</th><th class="l">Equipo</th><th>Pts</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th class="hide-sm">GF</th><th class="hide-sm">GC</th><th>DG</th><th class="hide-sm">Últimos</th></tr></thead>
    <tbody>${g.rows.map((r,i)=>`<tr class="${i===0&&r.pj?"lead":""}"><td class="pos num">${i+1}</td><td class="l">${teamBtn(r.team)}</td>
      <td class="pts num">${r.pts}</td><td class="num">${r.pj}</td><td class="num">${r.pg}</td><td class="num">${r.pe}</td><td class="num">${r.pp}</td>
      <td class="num hide-sm">${r.gf}</td><td class="num hide-sm">${r.gc}</td><td class="num">${r.gf-r.gc>0?"+":""}${r.gf-r.gc}</td>
      <td class="hide-sm"><span class="form" aria-label="Últimos resultados">${r.form.slice(-5).map(f=>`<i class="${f}" title="${{W:"Ganó",D:"Empató",L:"Perdió"}[f]}"></i>`).join("")}</span></td></tr>`).join("")}</tbody>
    </table></div></section>`).join("")+`<p class="hint">Desempate: puntos, diferencia de gol y goles a favor.${multi?" Los partidos interzonales suman para la tabla de cada equipo.":""}</p>`;
}
function evList(m,team){
  const g=[],c=[];
  for(const [p,tm,k,n] of m.ev){if(tm!==team)continue;
    if(k==="G")g.push(`<span><i class="ball" aria-label="Gol">⚽</i>${esc(norm(p)==="AUTO GOL"?"En contra":nice(p))}${n>1?` ×${n}`:""}</span>`);
    else c.push(`<span><i class="card ${k}" aria-label="${k==="A"?"Amarilla":"Roja"}"></i>${esc(nice(p))}</span>`)}
  return g.concat(c).join("");
}
function matchCard(m,{label}={}){
  const p=played(m);
  const win=m.win&&m.win!=="?"?m.win:null;
  return `<article class="match">
    <div class="side home"><div class="who">${teamBtn(m.home)}</div><div class="ev">${evList(m,m.home)}</div></div>
    <div class="score num ${p?"":"pending"} ${!p&&m.time&&!(m.phase==="regular"&&m.round<lastRound(T()))?"sched":""}">${p?`${m.hg}<span style="opacity:.4"> – </span>${m.ag}`:(m.phase==="regular"&&m.round<lastRound(T())?"Postergado":m.time?esc(m.time):"Por jugar")}${m.time||m.cancha?`<small class="when">${p&&m.time?esc(m.time)+" · ":""}${esc(m.cancha||"")}</small>`:""}${label?`<small>${esc(label)}</small>`:""}${m.pen?`<small>Penales ${esc(m.pen)}</small>`:""}${win&&p&&m.hg===m.ag?`<small>Pasa ${esc(win)}</small>`:""}</div>
    <div class="side away"><div class="who">${teamBtn(m.away)}</div><div class="ev">${evList(m,m.away)}</div></div>
    ${m.phase==="regular"&&m.inst&&T().groups.length>1?`<div class="mfoot"><span class="tag ${m.inst==="Interzonal"?"iz":""}">${esc(m.inst)}</span></div>`:""}
    ${m.obs?`<div class="mfoot"><span class="note">${esc(m.obs)}</span></div>`:p&&!m.ev.some(e=>e[2]==="G")&&(m.hg+m.ag)>0?`<div class="mfoot"><span class="note">Sin goleadores cargados</span></div>`:""}
  </article>`;
}
function fmtDay(iso){const d=new Date(iso+"T12:00:00");if(isNaN(d))return "";
  return ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"][d.getDay()]+" "+d.getDate()+"/"+(d.getMonth()+1)}
function vFixture(t){
  const reg=regular(t);const rounds=[...new Set(reg.map(m=>m.round))].sort((a,b)=>a-b);
  if(!rounds.length)return `<div class="sheet empty">Todavía no hay fixture cargado.</div>`;
  if(S.round==null||!rounds.includes(S.round))S.round=lastRound(t)||rounds[0];
  const ms=reg.filter(m=>m.round===S.round).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99")||(a.cancha||"").localeCompare(b.cancha||"",undefined,{numeric:true}));
  const day=(ms.find(m=>m.date)||{}).date;
  const lr=lastRound(t);const done=r=>r<lr||reg.filter(m=>m.round===r).every(played);
  return `<section class="view">
    <div class="sec-h"><h2>Fecha ${S.round}</h2><span class="hint">${day?fmtDay(day)+" · ":""}${ms.filter(played).length} de ${ms.length} jugados</span></div>
    <div class="rounds" role="group" aria-label="Elegir fecha" style="margin-block:10px 12px">${rounds.map(r=>`<button data-round="${r}" class="num ${done(r)?"done":""}" aria-pressed="${r===S.round}">${r}</button>`).join("")}</div>
    <div class="sheet">${ms.map(m=>matchCard(m)).join("")}</div></section>`;
}
function vFixtureKO(t){
  const ORD=["Octavos de final","Cuartos de final","Semifinal","Tercer puesto","Final"];
  const ms=t.matches.filter(m=>m.phase==="playoff");const stages=ORD.filter(s=>ms.some(m=>m.stage===s));
  if(!stages.length)return `<div class="sheet empty">Todavía no hay partidos cargados.</div>`;

function suspensions(t){
  const last=lastRound(t);const out=[];
  for(const c of cardsOf(t)){if(c.k!=="R"||c.m.phase!=="regular")continue;
    const until=c.m.round+c.n;out.push({...c,from:c.m.round+1,until,pending:until>last})}
  /* Amarillas: cada 3 acumuladas = 1 fecha de suspensión; con 2 (o 5, 8…) el jugador queda en aviso. */
  const order=m=>m.phase==="regular"?m.round:1000+(STAGES.indexOf(m.stage)*3)+(m.leg||0);
  const yel={};for(const c of cardsOf(t)){if(c.k!=="A")continue;const k=norm(c.p)+"|"+c.team;(yel[k]=yel[k]||{p:c.p,team:c.team,list:[]}).list.push(c.m)}
  const ylist=Object.values(yel).map(y=>{y.list.sort((a,b)=>order(a)-order(b));const yt=[];
    y.list.forEach((m,i)=>{if((i+1)%3===0)yt.push(m)});
    const lastTrig=yt[yt.length-1];
    y.n=y.list.length;y.cycle=y.n%3;
    y.pending=!!lastTrig&&y.cycle===0&&lastTrig.phase==="regular"&&lastTrig.round===last&&t.status!=="finalizado";
    y.trig=yt;return y});
  const susYel=[];for(const y of ylist)for(const m of y.trig)susYel.push({p:y.p,team:y.team,m,pending:y.pending&&m===y.trig[y.trig.length-1]});
  return {last,reds:out.sort((a,b)=>b.m.round-a.m.round),
    alert:ylist.filter(y=>y.cycle===2).sort((a,b)=>a.team.localeCompare(b.team)||a.p.localeCompare(b.p)),
    susYel:susYel.sort((a,b)=>order(b.m)-order(a.m)),
    yel:ylist.sort((a,b)=>b.n-a.n||a.p.localeCompare(b.p))};
}
function vTarjetas(t){

    <div style="margin-top:10px">${rankList("yel"+t.id,yel,y=>`<div class="sanc"><span>${y.list.map(()=>`<i class="card A"></i>`).join("")}</span>

      <span class="pill yel num">${y.n}</span></div>`,10)}</div>
  </section>`;

function series(ms){
  const map=new Map();
  for(const m of ms){const k=[m.home,m.away].sort().join("|");(map.get(k)||map.set(k,[]).get(k)).push(m)}
  return [...map.values()].map(legs=>{legs.sort((a,b)=>(a.leg||0)-(b.leg||0));
    const a=legs[0].home,b=legs[0].away;let ga=0,gb=0,allPlayed=true;
    for(const m of legs){if(!played(m)){allPlayed=false;continue}if(m.home===a){ga+=m.hg;gb+=m.ag}else{ga+=m.ag;gb+=m.hg}}
    const w=legs.find(m=>m.win)?.win;let winner=null;
    if(allPlayed){winner=w&&w!=="?"?w:(ga>gb?a:gb>ga?b:null)}
    return {legs,a,b,ga,gb,winner,unknown:allPlayed&&!winner}});
}

function resolveFormat(t){
  const F=FORMATS[t.format];const st=standings(t);const reg=regular(t);
  const groupsDone=reg.length>0&&reg.every(played);
  const posOf={};st.forEach((g,gi)=>g.rows.forEach((r,i)=>posOf[r.team]=i+1));
  const seed=k=>{const m=k.match(/^(\d+)([A-Z]?)$/);const pos=+m[1];const g=m[2]?st[m[2].charCodeAt(0)-65]:st[0];
    const r=g&&g.rows[pos-1];return r&&r.pj?r.team:null};
  const seedLabel=k=>/[A-Z]$/.test(k)?`${k.slice(0,-1)}° ${k.slice(-1)}`:`${k}°`;
  const po=t.matches.filter(m=>m.phase==="playoff");
  const out={};
  for(const [comp,nodes] of Object.entries(F.comps))for(const n of nodes)out[comp+"/"+n.id]={...n,comp};
  const nodeOf=id=>out["Zona Campeonato/"+id]||out["Copa Revancha/"+id];
  const findSeries=(n,a,b)=>{const ms=po.filter(m=>m.comp===n.comp&&m.stage===n.stage&&[m.home,m.away].sort().join("|")===[a,b].sort().join("|"));return ms.length?series(ms)[0]:null};
  const memo={};
  const solve=n=>{const key=n.comp+"/"+n.id;if(memo[key])return memo[key];
    const side=src=>{
      if(src.seed){return {team:seed(src.seed),label:seedLabel(src.seed),seed:true,prov:!groupsDone}}
      if(src.w||src.l){const sub=solve(nodeOf(src.w||src.l));const want=src.w?sub.winner:sub.loser;
        return {team:want||null,label:(src.w?"Gan. ":"Perd. ")+sub.name,prov:sub.prov&&!want}}
      if(src.lrank){const qs=["q1","q2","q3","q4"].map(id=>solve(nodeOf(id)));
        if(qs.every(q=>q.loser)){const ls=qs.map(q=>q.loser).sort((x,y)=>posOf[x]-posOf[y]);return {team:ls[src.lrank-1],label:`${src.lrank}° eliminado ZC`,prov:false}}
        return {team:null,label:`${src.lrank}° eliminado ZC`,prov:false}}
    };
    const a=side(n.a),b=side(n.b);let ser=null,winner=null,loser=null;
    if(a.team&&b.team&&!a.prov&&!b.prov){ser=findSeries(n,a.team,b.team);if(ser&&ser.winner){winner=ser.winner;loser=winner===a.team?b.team:a.team}}
    return memo[key]={...n,A:a,B:b,ser,winner,loser,prov:a.prov||b.prov};
  };
  const res={};for(const comp of Object.keys(F.comps))res[comp]=F.comps[comp].map(n=>solve({...n,comp}));
  return {res,groupsDone,note:F.note,last:lastRound(t),total:Math.max(0,...reg.map(m=>m.round))};
}
function projBox(n){
  const score=(side)=>{if(!n.ser)return "";const x=n.ser;const tm=side.team;return played(x.legs[0])?(tm===x.a?x.ga:x.gb):""};
  const row=(sd)=>`<div class="brow prow ${n.winner&&n.winner===sd.team?"w":""}"><span class="seed">${sd.seed?esc(sd.label):""}</span>
    ${sd.team?`${crest(sd.team)}<span class="bn">${esc(sd.team)}</span>`:`<span></span><span class="bn ph">${esc(sd.seed?"A definir":sd.label)}</span>`}<b class="num">${score(sd)}</b></div>`;
  return `<div class="bbox ${n.prov?"prov":""}">${row(n.A)}${row(n.B)}${n.winner&&n.ser&&n.ser.ga===n.ser.gb?`<i class="bpen">pen.</i>`:""}</div>`;

function vProjected(t){

  return `<section class="view"><div class="sec-h"><h2>Play-off</h2><span class="hint">${groupsDone?"Cruces definidos":`Proyección tras la fecha ${last} de ${total}`}</span></div>
    ${groupsDone?"":`<p class="note" style="margin:8px 0 0">Los cruces salen de la tabla actual y pueden cambiar hasta que termine la fase de grupos. Los marcados con línea punteada todavía no están confirmados.</p>`}
    <p class="note" style="margin:6px 0 0">${esc(note)}</p></section>`+
  Object.entries(res).map(([comp,nodes])=>{
    const cols=stOrder.filter(s=>nodes.some(n=>n.stage===s));

    return `<section class="view" style="display:flex;flex-direction:column;gap:12px"><div class="sec-h"><h2>${esc(comp)}</h2>${comp==="Copa Revancha"?`<span class="hint">No suma para goleadores ni valla</span>`:""}</div>
    ${fin&&fin.winner?`<div class="champ">${crest(fin.winner)}<div><div class="cup">Campeón</div><div class="name">${esc(fin.winner)}</div></div></div>`:""}
    <div class="sheet bwrap"><div class="bracket">${cols.map((s,i)=>{const ns=nodes.filter(n=>n.stage===s);const legs=ns[0].legs;
      return `<div class="bcol ${i===cols.length-1&&!third?"last":""} ${s==="Final"?"last":""}"><div class="bh">${esc(s.replace(" de final",""))} <small>${legs>1?"ida y vuelta":"un partido"}</small></div>
      <div class="bslots">${ns.map(projBox).join("")}</div></div>`}).join("")}
      ${third?`<div class="bcol last"><div class="bh">3er puesto <small>un partido</small></div><div class="bslots">${projBox(third)}</div></div>`:""}</div></div></section>`}).join("");
}
function bracket(ms){
  const order=["Octavos de final","Cuartos de final","Semifinal","Final"].filter(s=>ms.some(m=>m.stage===s));
  if(!order.length)return "";
  const SS={};for(const s of order)SS[s]=series(ms.filter(m=>m.stage===s));
  const depth=order.length,top=SS[order[depth-1]].length;
  const grid=order.map((s,i)=>Array(top*2**(depth-1-i)).fill(null));const used=new Set();
  const kidsOf=(i,x)=>[x.a,x.b].map(team=>SS[order[i-1]].find(y=>y.a===team||y.b===team)).filter(Boolean);
  const slotOf=(i,x)=>i===0?Math.min(...x.legs.map(m=>m.slot??Infinity)):Math.min(Infinity,...kidsOf(i,x).map(k=>slotOf(i-1,k)));
  const place=(i,x,pos)=>{grid[i][pos]=x;used.add(x);if(!i)return;
    kidsOf(i,x).filter(k=>!used.has(k)).sort((p,q)=>slotOf(i-1,p)-slotOf(i-1,q)).forEach((f,j)=>place(i-1,f,pos*2+j))};
  SS[order[depth-1]].forEach((x,k)=>place(depth-1,x,k));
  order.forEach((s,i)=>SS[s].filter(x=>!used.has(x)).forEach(x=>{const k=grid[i].indexOf(null);if(k>=0){grid[i][k]=x;used.add(x)}}));
  const third=series(ms.filter(m=>m.stage==="Tercer puesto"))[0];
  const box=x=>{if(!x)return `<div class="bbox empty" aria-hidden="true"></div>`;
    const row=team=>`<div class="brow ${x.winner===team?"w":""}">${crest(team)}<span class="bn">${esc(team)}</span><b class="num">${played(x.legs[0])?(team===x.a?x.ga:x.gb):"–"}</b></div>`;
    return `<div class="bbox">${row(x.a)}${row(x.b)}${x.winner&&x.ga===x.gb?`<i class="bpen">pen.</i>`:""}</div>`};
  return `<div class="sheet bwrap"><div class="bracket">${order.map((s,i)=>`<div class="bcol ${i===depth-1?"last":""}"><div class="bh">${esc(s.replace(" de final",""))}${grid[i].length&&SS[s][0]?.legs.length>1?" <small>ida y vuelta</small>":""}</div>
    <div class="bslots">${grid[i].map(box).join("")}</div></div>`).join("")}
    ${third?`<div class="bcol last"><div class="bh">3er puesto</div><div class="bslots">${box(third)}</div></div>`:""}</div></div>`;
}
function vHistorial(){
  const ts=DATA.tournaments.filter(t=>t.cat===S.cat);
  const palm=[];for(const t of ts){const po=t.matches.filter(m=>m.phase==="playoff"&&m.stage==="Final");
    for(const c of [...new Set(po.map(m=>m.comp))]){const s=series(po.filter(m=>m.comp===c))[0];palm.push({t,c,s})}}
  const all=new Map();for(const t of ts)for(const e of goalEvents(t)){const k=norm(e.p);const x=all.get(k)||{p:e.p,g:0,teams:new Set(),ts:new Set()};x.g+=e.n;x.teams.add(e.team);x.ts.add(t.name);all.set(k,x)}
  const top=[...all.values()].sort((a,b)=>b.g-a.g);
  const totals=ts.filter(t=>t.status!=="proximamente").map(t=>({t,pj:t.matches.filter(played).length,g:t.matches.filter(played).reduce((a,m)=>a+m.hg+m.ag,0)}));
  return `<section class="view"><div class="sec-h"><h2>Campeones</h2><span class="hint">Categoría ${esc(S.cat)}</span></div>
    <div class="sheet" style="margin-top:10px">${palm.length?palm.map(x=>`<div class="palm"><div><div class="tn">${esc(x.t.name)}</div><div class="cp">${esc(x.c)}</div></div>
      <div class="w">${x.s.winner?`${crest(x.s.winner)}<span>${esc(x.s.winner)}</span>`:`<span class="pill yel">A confirmar</span>`}</div></div>`).join(""):`<div class="empty">Todavía no hay finales jugadas.</div>`}</div></section>
  <section class="view"><div class="sec-h"><h2>Goleadores históricos</h2><span class="hint">Suma de todos los torneos cargados</span></div>
    <div style="margin-top:10px">${rankList("hist"+S.cat,top,(s,i)=>`<div class="rank ${i<3?"top3":""}"><div class="n num">${i+1}</div>
      <div class="who"><b>${esc(nice(s.p))}</b><span>${esc([...s.teams].join(", "))} · ${s.ts.size} ${s.ts.size===1?"torneo":"torneos"}</span></div>
      <div class="val num">${s.g}<small>goles</small></div></div>`,10)}</div></section>
  <section class="view"><div class="sec-h"><h2>Torneos</h2></div>
    <div class="sheet" style="margin-top:10px">${totals.map(x=>`<div class="palm"><div><div class="tn">${esc(x.t.name)}</div><div class="cp">${x.pj} partidos · ${x.g} goles · ${x.pj?(x.g/x.pj).toFixed(1).replace(".",","):0} por partido</div></div>
      <button class="linkbtn" data-goto="${esc(x.t.id)}">Ver torneo</button></div>`).join("")}</div></section>`;
}

/* ---------- ficha de equipo ---------- */
function openTeam(name){
  const t=T();const ms=t.matches.filter(m=>m.home===name||m.away===name).sort((a,b)=>(a.phase===b.phase?0:a.phase==="regular"?-1:1)||(a.round||0)-(b.round||0));
  const r=standings(t).flatMap(g=>g.rows).find(x=>x.team===name);
  const sc=scorers(t).filter(s=>s.team===name).slice(0,5);
  const d=$("#team");
  d.innerHTML=`<div class="dlg-h">${crest(name)}<h3>${esc(name)}</h3><button class="close" aria-label="Cerrar" data-close>×</button></div>
  <div class="dlg-b">${r?`<div class="stats"><div><b class="num">${r.pts}</b><span>Puntos</span></div><div><b class="num">${r.pg}-${r.pe}-${r.pp}</b><span>G-E-P</span></div><div><b class="num">${r.gf}</b><span>A favor</span></div><div><b class="num">${r.gc}</b><span>En contra</span></div></div>`:""}
  ${sc.length?`<div><h3 style="margin-bottom:6px">Sus goleadores</h3>${sc.map(s=>`<div class="mini"><span class="r num">${s.g}</span><span>${esc(nice(s.p))}</span><span></span></div>`).join("")}</div>`:""}
  <div><h3 style="margin-bottom:6px">Partidos · ${esc(t.name)}</h3>${ms.map(m=>{const home=m.home===name,op=home?m.away:m.home,p=played(m);
    const gf=home?m.hg:m.ag,gc=home?m.ag:m.hg,res=!p?"":gf>gc?"W":gf<gc?"L":(m.win?(m.win===name?"W":m.win==="?"?"D":"L"):"D");
    return `<div class="mini"><span class="r">${m.phase==="regular"?"F"+m.round:esc(m.stage.split(" ")[0].slice(0,5))}</span><span>${home?"vs":"en"} ${esc(op)}</span>
      <span>${p?`<span class="s num">${gf}-${gc}</span><span class="res ${res}">${{W:"G",D:"E",L:"P"}[res]}</span>`:`<span class="note">Por jugar</span>`}</span></div>`}).join("")}</div></div>`;
  try{d.showModal()}catch(e){d.setAttribute("open","")}
}

/* ---------- render ---------- */
function renderPicker(){
  const cats=[...new Set(DATA.tournaments.map(t=>t.cat))];
  $("#cats").innerHTML=cats.map(c=>`<button aria-pressed="${c===S.cat}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
  const ts=DATA.tournaments.filter(t=>t.cat===S.cat);
  $("#season").innerHTML=ts.map(t=>`<option value="${esc(t.id)}" ${t.id===S.tid?"selected":""}>${esc(t.name)}${{finalizado:"",proximamente:" · próximamente"}[t.status]??" · en curso"}</option>`).join("");
  $("#tabs").innerHTML=tabsFor(T()).map(([k,l])=>`<button role="tab" aria-selected="${k===S.tab}" data-tab="${k}" id="tab-${k}">${l}</button>`).join("");
}
function render(){
  {const tb=tabsFor(T());if(!tb.some(([k])=>k===S.tab))S.tab=S.tab==="playoff"&&isKO(T())?"llave":S.tab==="llave"?"playoff":tb[0][0];if(!tb.some(([k])=>k===S.tab))S.tab=tb[0][0]}
  renderPicker();const t=T();
  $("#subtitle").textContent=`${S.cat} · ${t.name}${{finalizado:" · finalizado",proximamente:" · próximamente"}[t.status]||""}`;
  const kind=torneoKind(t);document.documentElement.dataset.torneo=kind;
  $("#logo").src=LOGOS[kind];
  if(t.status==="proximamente"&&S.tab!=="historial"){$("#main").innerHTML=vSoon(t);store("gcl-state",JSON.stringify({cat:S.cat,tid:S.tid,tab:S.tab}));return}
  const v={llave:vPlayoff,posiciones:vPosiciones,fixture:isKO(t)?vFixtureKO:vFixture,goleadores:vGoleadores,vallas:vVallas,tarjetas:vTarjetas,playoff:vPlayoff,historial:vHistorial}[S.tab];
  $("#main").innerHTML=v(t);
  store("gcl-state",JSON.stringify({cat:S.cat,tid:S.tid,tab:S.tab}));
}
function pickDefault(cat){const ts=DATA.tournaments.filter(t=>t.cat===cat);return (ts.find(t=>t.status==="en curso")||ts.find(t=>t.status==="finalizado")||ts[0]).id}
function torneoKind(t){const n=norm(t.name);return n.startsWith("COPA")?"copa":n.startsWith("NOCTURNO")?"nocturno":n.startsWith("MUNDIALITO")?"mundialito":"liga"}
const LOGOS={liga:"marca/toro-naranja.png",copa:"marca/toro-blanco.webp",nocturno:"marca/toro-blanco.webp",mundialito:"marca/toro-naranja.png"};
function vSoon(t){const label=(ALL_TABS.find(([k])=>k===S.tab)||[,""])[1];
  return `<section class="view"><div class="sheet soon"><img src="marca/toro-naranja.png" alt="">
    <span class="chip">${esc(S.cat)} · ${esc(t.name)}</span><div class="big">Próximamente</div>
    <p>Este torneo todavía no empezó. Cuando arranque, en ${esc(label)} vas a ver toda la información actualizada fecha a fecha.</p></div></section>`}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.cat){const cur=T();S.cat=b.dataset.cat;const same=DATA.tournaments.find(t=>t.cat===S.cat&&cur&&t.name===cur.name);S.tid=same?same.id:pickDefault(S.cat);S.round=null;render()}
  else if(b.dataset.tab){S.tab=b.dataset.tab;try{history.replaceState(null,"","#"+S.tab)}catch(_){}render();window.scrollTo({top:0})}
  else if(b.dataset.round){S.round=+b.dataset.round;render()}
  else if(b.dataset.stage){S.stage=b.dataset.stage;render()}
  else if(b.dataset.more){S.showAll[b.dataset.more]=!S.showAll[b.dataset.more];render()}
  else if(b.dataset.goto){S.tid=b.dataset.goto;S.tab="posiciones";S.round=null;render();window.scrollTo({top:0})}
  else if(b.dataset.team){openTeam(b.dataset.team)}
  else if(b.hasAttribute("data-close")){$("#team").close()}
});
$("#team").addEventListener("click",e=>{if(e.target.id==="team")e.target.close()});
$("#season").addEventListener("change",e=>{S.tid=e.target.value;S.round=null;render()});

function boot(d){
  DATA=d;
  let saved=null;try{saved=JSON.parse(store("gcl-state")||"null")}catch(e){}
  if(saved&&DATA.tournaments.some(t=>t.id===saved.tid)){S.cat=saved.cat;S.tid=saved.tid;S.tab=saved.tab||S.tab}
  else{S.cat=DATA.tournaments[0].cat;S.tid=pickDefault(S.cat)}
  const h=location.hash.replace("#","");if(ALL_TABS.some(([k])=>k===h))S.tab=h;
  $("#foot").textContent=DATA.updated?`Datos actualizados al ${DATA.updated}`:"";
  render();
}
fetch("data.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(boot)
  .catch(()=>{$("#main").innerHTML=`<div class="sheet empty">No se pudieron cargar las estadísticas. Probá recargar la página.</div>`});
})();
</script>

<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
